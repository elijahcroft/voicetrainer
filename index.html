  // --- generic live-meter exercise -----------------------------------------

  // Steps, cautions and diagrams are worth reading once and are in the way
  // every session after that. Folding them away puts the meters back within a
  // glance of the thing you are doing, instead of a screenful below it — the
  // same reason the endings drill keeps its prompt and its verdict adjacent.
  function explainer(cfg) {
    var body =
      (cfg.steps ? '<ol class="steps">' +
        cfg.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' : '') +
      (cfg.note ? '<p class="note">' + cfg.note + '</p>' : '') +
      (cfg.diagram ? cfg.diagram() : '') +
      (cfg.extra || '');
    if (!body) return '';
    return '<details class="explain"><summary>' +
      (cfg.summary || 'How to do it, and why it works') + '</summary><div>' + body + '</div></details>';
  }

  function simpleExercise(cfg) {
    var html =
      '<div class="card">' +
        '<h3>' + cfg.title + '</h3>' +
        '<p class="why">' + cfg.why + '</p>' +
        explainer(cfg) +
        '<canvas id="rib" class="trace" style="height:210px" role="img" aria-label="Live pitch trace"></canvas>' +
        '<div class="meters">' +
          meter('m-pitch', 'Pitch', '', true) +
          meter('m-res', 'Resonance', '', true) +
          meter('m-weight', 'Weight') +
          meter('m-time', cfg.showBand ? 'In target' : 'Voiced time', '', true) +
        '</div>' +
        takeControls('Start take') +
      '</div>';

    var rib, running = false, inBandMs = 0, voicedMs = 0, band = null, lastTs = null;

    function setRunning(el, on) {
      running = on;
      inBandMs = 0; voicedMs = 0; lastTs = null;
      rib.pts = [];
      el.textContent = on ? 'Stop' : 'Start take';
      el.className = on ? 'recording' : 'primary';
      document.getElementById('status').textContent = on ? 'recording — nothing is saved' : '';
    }

    return {
      html: html,
      mount: function () {
        rib = new Ribbon(document.getElementById('rib'));
        rib.resize();
        band = cfg.showBand ? targetBand() : null;
        rib.draw(band);
        document.getElementById('go').onclick = function () { setRunning(this, !running); };
      },
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false);
      },
      frame: function (a, ts) {
        var f0 = smoothF0.value();
        var inBand = !!(band && f0 && f0 >= band.lo && f0 <= band.hi);
        setMeter('m-pitch', a.voiced && f0 ? f0.toFixed(0) + ' Hz' : '--',
          band ? 'target ' + band.center.toFixed(0) + ' Hz' : 'comfortable is fine',
          { hit: inBand, fill: a.voiced && f0 ? pitchFill(f0) : 0,
            markAt: band ? pitchFill(band.center) : null });

        var res = smoothRes.value();
        setMeter('m-res', res ? res.toFixed(1) + ' cm' : '--', resonanceSub(res),
          resonanceMeterOpts(res));

        var w = smoothWeight.value();
        setMeter('m-weight', weightLabel(w), weightSub(w));

        // Real elapsed time, not a frame count: frame rate varies by display
        // and by load, so counting frames made a 120 Hz screen read half speed.
        var dt = lastTs == null ? 0 : Math.min(100, ts - lastTs);
        lastTs = ts;

        if (running) {
          rib.push(a.voiced ? f0 : 0);
          if (a.voiced && f0) {
            voicedMs += dt;
            if (inBand) inBandMs += dt;
          }
          var pct = voicedMs ? (inBandMs / voicedMs * 100) : 0;
          var secs = voicedMs / 1000;
          setMeter('m-time', band ? pct.toFixed(0) + '%' : secs.toFixed(0) + ' s',
            band ? 'aim for 80%' : 'of ' + cfg.goalSeconds + ' s',
            band ? { hit: pct >= 80, fill: pct / 100, markAt: 0.8 }
                 : { hit: secs >= cfg.goalSeconds, fill: secs / cfg.goalSeconds });
        }
        rib.draw(band);
      }
    };
  }

  // Shared start/stop row. The button is inert without a microphone rather than
  // erroring on click.
  function takeControls(label, extra) {
    return '<div class="row">' +
      '<button id="go" class="primary" data-needs-mic>' + label + '</button>' +
      (extra || '') +
      '<span id="status" style="color:var(--dim);font-size:13px"></span>' +
      '</div>' + micHint();
  }
  function micHint() {
    return '<div class="banner info compact" id="micHint" hidden style="margin:12px 0 0">' +
      '<span aria-hidden="true">🎙</span><span>Press <b>Start microphone</b> in the top bar to enable this ' +
      'exercise. Nothing is uploaded or recorded — every frame is analysed and discarded.</span>' +
      '</div>';
  }

  function resonanceSub(res) {
    if (res == null) return 'lower larynx = larger number';
    if (base.resonance == null) return 'lower larynx = larger number';
    var goal = (RESONANCE_GOAL - 1) * 100;
    return pctVsBaseline(res, base.resonance) + ' vs baseline (goal +' + goal.toFixed(0) + '%)';
  }
  // Signed percentage change, rounded before the sign is chosen so a value a
  // hair under the baseline reads "+0.0%" rather than "-0.0%".
  function pctVsBaseline(value, baseline) {
    var pct = (value / baseline - 1) * 100;
    if (Math.abs(pct) < 0.05) pct = 0;
    return (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
  }

  // Bar runs from baseline to the goal, so "full" means the goal is reached.
  function resonanceMeterOpts(res) {
    if (res == null || base.resonance == null) return { hit: false, fill: 0 };
    var span = base.resonance * (RESONANCE_GOAL - 1);
    return {
      hit: res >= base.resonance * RESONANCE_GOAL,
      fill: (res - base.resonance) / span,
      markAt: 1
    };
  }
  // Weight is the softest of the four measures and is only ever meaningful
  // against your own baseline — with no baseline there is nothing to say, so
  // the raw number is withheld rather than shown as if it meant something.
  function weightLabel(w) {
    if (w == null || base.weight == null) return '--';
    var d = w - base.weight;
    if (d > 2) return 'heavier';
    if (d < -2) return 'lighter';
    return 'baseline';
  }
  function weightSub(w) {
    if (base.weight == null) return 'calibrate to get a reference';
    if (w == null) return 'relative to your baseline';
    return (w - base.weight >= 0 ? '+' : '') + (w - base.weight).toFixed(1) + ' vs baseline';
  }

  // --- yawn-sigh: resonance only, pitch deliberately hidden ------------------

  function buildYawn() {
    var html =
      '<div class="card">' +
        '<h3>Yawn-sigh — lowering the larynx</h3>' +
        '<p class="why">A larger resonating space is the single biggest non-pitch cue to a masculine ' +
        'voice, and unlike pitch it costs your voice nothing. Beginning a yawn drops the larynx; the ' +
        'sigh keeps it there while you make sound.</p>' +
        explainer({
          steps: [
            'Begin a yawn, and feel the voice box drop in your neck.',
            'Before the yawn finishes, sigh out an easy open "ahh".',
            'Let the pitch land wherever it wants — only resonance is scored here.'
          ],
          diagram: DIAGRAMS.larynx,
          extra: '<div class="banner info" style="margin:14px 0 0">' +
            'The pitch readout is hidden on purpose. Larynx height and pitch tend to move together, ' +
            'and separating them is the skill this exercise builds — so pitch is removed from view ' +
            'rather than left as something to chase.</div>'
        }) +
        '<canvas id="resCanvas" class="trace" role="img" aria-label="Live resonance trace"></canvas>' +
        '<div class="meters">' +
          meter('m-res', 'Resonance', '', true) +
          meter('m-best', 'Best this take') +
          '<div class="meter muted"><div class="lab">Pitch</div><div class="val">—</div>' +
            '<div class="sub">hidden for this exercise</div></div>' +
        '</div>' +
        takeControls('Start take') +
      '</div>';

    var cv, g, hist = [], running = false, best = null;

    function draw() {
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) {
        cv.width = r.width * dpr; cv.height = r.height * dpr;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      var w = r.width, h = r.height;
      g.clearRect(0, 0, w, h);
      g.fillStyle = '#0e1016'; g.fillRect(0, 0, w, h);

      var lo = 12, hi = 24;
      function y(v) { return h - ((v - lo) / (hi - lo)) * h; }

      if (base.resonance != null) {
        var yb = y(base.resonance), yg = y(base.resonance * RESONANCE_GOAL);
        g.fillStyle = 'rgba(90,211,154,.10)';
        g.fillRect(0, 0, w, yg);
        g.strokeStyle = 'rgba(90,211,154,.55)'; g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(0, yg); g.lineTo(w, yg); g.stroke();
        g.strokeStyle = 'rgba(143,151,173,.45)';
        g.beginPath(); g.moveTo(0, yb); g.lineTo(w, yb); g.stroke();
        g.setLineDash([]);
        g.fillStyle = 'rgba(90,211,154,.9)'; g.font = '11px system-ui';
        g.fillText('goal ' + (base.resonance * RESONANCE_GOAL).toFixed(1) + ' cm', 6, yg - 5);
        g.fillStyle = 'rgba(143,151,173,.8)';
        g.fillText('baseline ' + base.resonance.toFixed(1) + ' cm', 6, yb + 13);
      }

      g.strokeStyle = '#6ea8ff'; g.lineWidth = 2.2;
      var drawing = false;
      for (var i = 0; i < hist.length; i++) {
        if (hist[i] == null) { if (drawing) { g.stroke(); drawing = false; } continue; }
        var x = i * 2, yy = y(Math.min(hi, Math.max(lo, hist[i])));
        if (!drawing) { g.beginPath(); g.moveTo(x, yy); drawing = true; } else g.lineTo(x, yy);
      }
      if (drawing) g.stroke();
    }

    function setRunning(el, on) {
      running = on; hist = []; best = null;
      el.textContent = on ? 'Stop' : 'Start take';
      el.className = on ? 'recording' : 'primary';
      document.getElementById('status').textContent = on ? 'recording — nothing is saved' : '';
    }

    return {
      html: html,
      mount: function () {
        cv = document.getElementById('resCanvas');
        g = cv.getContext('2d');
        draw();
        document.getElementById('go').onclick = function () { setRunning(this, !running); };
      },
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false);
      },
      frame: function () {
        var res = smoothRes.value();
        setMeter('m-res', res ? res.toFixed(1) + ' cm' : '--', resonanceSub(res),
          resonanceMeterOpts(res));
        if (running) {
          hist.push(res);
          if (res != null && (best == null || res > best)) best = res;
          while (hist.length > 400) hist.shift();
          setMeter('m-best', best != null ? best.toFixed(1) + ' cm' : '--',
            base.resonance != null && best != null
              ? pctVsBaseline(best, base.resonance) + ' above baseline' : '');
          draw();
        }
      }
    };
  }

  // --- calibration ----------------------------------------------------------

  function buildCalibrate() {
    var html =
      '<div class="card">' +
        '<h3>Calibrate</h3>' +
        '<p class="why">Every target this tool shows is derived from your own voice, not from a ' +
        'population average. Two measurements are needed: how you speak now, and how low you can ' +
        'comfortably go. The second one exists so the tool can refuse to set a target that would ' +
        'have you grinding at the bottom of your range.</p>' +
        '<div id="calStep"></div>' +
      '</div>';

    var stage = 0, collecting = false;
    var f0s = [], resList = [], weights = [], lowest = null;
    var voicedMs = 0, lastTs = null;

    function render() {
      var el = document.getElementById('calStep');
      if (stage === 0) {
        el.innerHTML =
          '<div class="banner info">Step 1 of 2 — habitual voice</div>' +
          '<p>Read this aloud in your completely normal, everyday voice. Do not try to change it; ' +
          'this measurement is the reference everything else is compared against.</p>' +
          '<div class="passage">' + PASSAGE + '</div>' +
          '<div class="meters">' + meter('c-f0', 'Pitch') + meter('c-res', 'Resonance') +
            meter('c-n', 'Voiced speech', '', true) + '</div>' +
          '<div class="row"><button id="calGo" class="primary" data-needs-mic>Start reading</button>' +
          '<span id="calStatus" style="color:var(--dim);font-size:13px"></span></div>' + micHint();
        document.getElementById('calGo').onclick = toggle;
      } else if (stage === 1) {
        el.innerHTML =
          '<div class="banner info">Step 2 of 2 — comfortable floor</div>' +
          '<p>Sigh downward on "ahh" from a comfortable pitch, and stop the moment the sound turns ' +
          'creaky, breathy, or effortful. <b>Do not push for your lowest possible note</b> — the point ' +
          'is the lowest note that still sounds clear and takes no effort. Do it three or four times.</p>' +
          explainer({ summary: 'What counts as the bottom of your range', diagram: DIAGRAMS.glide }) +
          '<div class="meters">' + meter('c-f0', 'Pitch') + meter('c-low', 'Lowest clear') + '</div>' +
          '<div class="row"><button id="calGo" class="primary" data-needs-mic>Start glides</button>' +
          '<span id="calStatus" style="color:var(--dim);font-size:13px"></span></div>' + micHint();
        document.getElementById('calGo').onclick = toggle;
      } else {
        var t = pitchTarget();
        el.innerHTML =
          '<div class="banner info">Calibration complete</div>' +
          '<table><tr><th>Measure</th><th>Value</th></tr>' +
          '<tr><td>Habitual pitch</td><td class="num">' + base.habitualF0.toFixed(0) + ' Hz</td></tr>' +
          '<tr><td>Comfortable floor</td><td class="num">' + base.safeFloor.toFixed(0) + ' Hz</td></tr>' +
          '<tr><td>Pitch target</td><td class="num">' + t.hz.toFixed(0) + ' Hz</td></tr>' +
          '<tr><td>Resonance baseline</td><td class="num">' + (base.resonance != null ? base.resonance.toFixed(1) + ' cm' : 'not measured') + '</td></tr>' +
          '<tr><td>Resonance goal</td><td class="num">' + (base.resonance != null ? (base.resonance * RESONANCE_GOAL).toFixed(1) + ' cm' : '—') + '</td></tr>' +
          '<tr><td>Intonation</td><td class="num">' + (base.intonationSd != null ? base.intonationSd.toFixed(1) + ' st' : '—') + '</td></tr>' +
          '</table>' +
          DIAGRAMS.pitchMap({
            now: base.habitualF0,
            target: t.hz,
            caption: 'Hz. Your habitual pitch and the target this tool will hold you to. The amber ' +
              'band is where listeners stop agreeing on a voice — a real change in perception, not ' +
              'a smooth gradient, which is why crossing it buys more than the same drop elsewhere.'
          }) +
          interpretation(t) +
          '<div class="row"><button id="calDone" class="primary">Start practising</button></div>';
        document.getElementById('calDone').onclick = function () { openExercise('straw'); };
      }
    }

    function interpretation(t) {
      var out = [];
      if (t.noHeadroom) {
        out.push('<div class="banner safety" style="margin-top:14px">There is no safe room to lower ' +
          'your pitch right now: your comfortable floor sits less than ' + FLOOR_MARGIN_ST + ' semitones ' +
          'below where you already speak, so the pitch target is simply where you are. This is a real ' +
          'result, not a measurement failure — and it is much less limiting than it sounds. Pitch ' +
          'accounts for under half of what makes a voice read as masculine; resonance is the larger ' +
          'share and is not constrained by your range at all. Work the yawn-sigh and "ng" exercises, ' +
          'and re-run the glides in a few weeks — the floor usually drops as technique improves.</div>');
      } else if (t.limited) {
        out.push('<div class="banner safety" style="margin-top:14px">Your target is set by your ' +
          'comfortable floor rather than by the 130 Hz mark, because reaching 130 Hz would put you ' +
          'within ' + FLOOR_MARGIN_ST + ' semitones of the bottom of your range. That is the right ' +
          'outcome, not a limitation of your voice: pitch explains under half of what makes a voice ' +
          'read as masculine, and resonance is both safer and available to you now. Weight the ' +
          'yawn-sigh and "ng" exercises more heavily.</div>');
      } else if (base.habitualF0 <= ANDROGYNOUS_LOW) {
        out.push('<div class="banner info" style="margin-top:14px">You already speak at or below the ' +
          'ambiguous zone (' + ANDROGYNOUS_LOW + '-' + ANDROGYNOUS_HIGH + ' Hz), where listeners stop ' +
          'reliably hearing a voice as female. Resonance and weight will do more for you than further ' +
          'pitch lowering.</div>');
      } else if (base.habitualF0 < ANDROGYNOUS_HIGH) {
        out.push('<div class="banner info" style="margin-top:14px">You already speak inside the ambiguous ' +
          'zone (' + ANDROGYNOUS_LOW + '-' + ANDROGYNOUS_HIGH + ' Hz), where gender recognition accuracy ' +
          'drops sharply — so you are past the steepest part of the curve already. There is still safe ' +
          'room to lower pitch toward your target, but resonance is the larger share of the effect from ' +
          'here on.</div>');
      }
      return out.join('');
    }

    function toggle() {
      collecting = !collecting;
      this.textContent = collecting ? 'Stop' : 'Start';
      this.className = collecting ? 'recording' : 'primary';
      if (collecting) {
        f0s = []; resList = []; weights = []; lowest = null;
        voicedMs = 0; lastTs = null;
        intonation.reset();
        document.getElementById('calStatus').textContent = 'listening…';
      } else {
        finishStage();
      }
    }

    function finishStage() {
      if (stage === 0) {
        if (voicedMs < MIN_VOICED_MS_CALIBRATE) {
          document.getElementById('calStatus').textContent =
            'Only ' + (voicedMs / 1000).toFixed(1) + ' s of voiced speech captured, and ' +
            (MIN_VOICED_MS_CALIBRATE / 1000) + ' s are needed. Read it again, a little more slowly.';
          return;
        }
        base.habitualF0 = median(f0s);
        base.resonance = resList.length >= MIN_FRAMES_FOR_MEDIAN ? median(resList) : null;
        base.weight = weights.length >= MIN_FRAMES_FOR_MEDIAN ? median(weights) : null;
        // Over the whole reading, not the rolling live window — a baseline
        // measured over the last 10 s only is not the same quantity a take is
        // later compared against.
        base.intonationSd = semitoneSd(f0s);
        save();
        // The baseline reading is the first point on every progress chart —
        // without it the trend has nothing to start from.
        recordTake('calibration', {
          f0: base.habitualF0, res: base.resonance,
          weight: base.weight, sd: base.intonationSd
        });
        stage = 1;
        render();
      } else if (stage === 1) {
        if (lowest == null) {
          document.getElementById('calStatus').textContent = 'No clear low notes captured. Try again.';
          return;
        }
        base.safeFloor = lowest;
        save();
        stage = 2;
        render();
      }
    }

    return {
      html: html,
      mount: render,
      abort: function () {
        if (collecting) {
          collecting = false;
          var b = document.getElementById('calGo');
          if (b) { b.textContent = 'Start'; b.className = 'primary'; }
          document.getElementById('calStatus').textContent =
            'Microphone stopped — this measurement was discarded. Start it again and retake.';
        }
      },
      frame: function (a, ts) {
        if (!collecting) return;
        var f0 = smoothF0.value();
        var dt = lastTs == null ? 0 : Math.min(100, ts - lastTs);
        lastTs = ts;
        if (stage === 0) {
          if (a.voiced && f0) {
            voicedMs += dt;
            f0s.push(f0);
            if (a.resonance != null) resList.push(a.resonance);
            if (a.weightRaw != null) weights.push(a.weightRaw);
          }
          var res0 = smoothRes.value();
          setMeter('c-f0', f0 ? f0.toFixed(0) + ' Hz' : '--');
          setMeter('c-res', res0 ? res0.toFixed(1) + ' cm' : '--');
          var enough = voicedMs >= MIN_VOICED_MS_CALIBRATE;
          setMeter('c-n', (voicedMs / 1000).toFixed(1) + ' s',
            enough ? 'enough — press Stop' : 'need ' + (MIN_VOICED_MS_CALIBRATE / 1000) + ' s of voice',
            { hit: enough, fill: voicedMs / MIN_VOICED_MS_CALIBRATE });
        } else if (stage === 1) {
          // Only accept clearly periodic frames. A creaky or pressed bottom note
          // has high aperiodicity, and counting it would set the floor too low —
          // which is exactly the failure this step exists to prevent.
          if (a.voiced && f0 && a.aperiodicity < 0.2 && a.rms > 0.02) {
            if (lowest == null || f0 < lowest) lowest = f0;
          }
          setMeter('c-f0', f0 ? f0.toFixed(0) + ' Hz' : '--',
            a.voiced ? (a.aperiodicity < 0.2 ? 'clear' : 'too creaky to count') : '');
          setMeter('c-low', lowest ? lowest.toFixed(0) + ' Hz' : '--', 'lowest clear tone');
        }
      }
    };
  }

  function median(arr) {
    var s = arr.slice().sort(function (a, b) { return a - b; });
    var m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  // Intonation range over a whole take, in semitones. The live meter uses the
  // 10 s rolling window; scored numbers use every frame of the take, so a
  // baseline and a later take are the same measurement over the same span.
  function semitoneSd(f0List) {
    if (!f0List || f0List.length < 2) return null;
    var st = f0List.map(function (hz) { return DSP.hzToSemitones(hz); });
    var m = 0, i;
    for (i = 0; i < st.length; i++) m += st[i];
    m /= st.length;
    var s = 0;
    for (i = 0; i < st.length; i++) s += (st[i] - m) * (st[i] - m);
    return Math.sqrt(s / (st.length - 1));
  }

  // --- glides ---------------------------------------------------------------

  function buildGlide() {
    var html =
      '<div class="card">' +
        '<h3>Pitch glides — re-measure your floor</h3>' +
        '<p class="why">Your comfortable range moves as technique improves. Re-measuring keeps the ' +
        'pitch target honest instead of letting it drift away from what your voice can actually hold.</p>' +
        explainer({
          steps: [
            'Sigh down on "ahh" from a comfortable pitch.',
            'Stop the moment the tone turns creaky or effortful.',
            'Repeat three or four times, then save the result as your new floor.'
          ],
          note: 'Creaky frames are discarded, so pushing past the clear part of the glide ' +
                'does not lower your floor — it just adds nothing.',
          diagram: DIAGRAMS.glide
        }) +
        '<canvas id="rib" class="trace" role="img" aria-label="Live pitch trace"></canvas>' +
        '<div class="meters">' + meter('m-pitch', 'Pitch', '', true) + meter('m-low', 'Lowest clear') +
          meter('m-cur', 'Current floor') + '</div>' +
        takeControls('Start', '<button id="saveFloor" disabled>Save as new floor</button>') +
      '</div>';

    var rib, running = false, lowest = null;

    function setRunning(el, on) {
      running = on;
      if (on) { lowest = null; rib.pts = []; }
      el.textContent = on ? 'Stop' : 'Start';
      el.className = on ? 'recording' : 'primary';
    }

    return {
      html: html,
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false);
      },
      mount: function () {
        rib = new Ribbon(document.getElementById('rib'));
        rib.resize(); rib.draw(null);
        setMeter('m-cur', base.safeFloor != null ? base.safeFloor.toFixed(0) + ' Hz' : '--');
        document.getElementById('go').onclick = function () { setRunning(this, !running); };
        document.getElementById('saveFloor').onclick = function () {
          if (lowest == null) return;
          base.safeFloor = lowest;
          save();
          setMeter('m-cur', base.safeFloor.toFixed(0) + ' Hz');
          document.getElementById('status').textContent = 'Floor updated — pitch target recalculated.';
          this.disabled = true;
        };
      },
      frame: function (a) {
        var f0 = smoothF0.value();
        var clear = a.voiced && f0 && a.aperiodicity < 0.2 && a.rms > 0.02;
        setMeter('m-pitch', f0 ? f0.toFixed(0) + ' Hz' : '--',
          a.voiced ? (clear ? 'clear' : 'creaky — not counted') : '',
          { fill: f0 ? pitchFill(f0) : 0, hit: clear });
        if (running) {
          rib.push(a.voiced ? f0 : 0);
          if (clear && (lowest == null || f0 < lowest)) {
            lowest = f0;
            document.getElementById('saveFloor').disabled = false;
          }
          setMeter('m-low', lowest ? lowest.toFixed(0) + ' Hz' : '--');
          rib.draw(null);
        }
      }
    };
  }

  // --- statement endings ----------------------------------------------------
  //
  // The only exercise that measures a *shape* rather than a level. Everything
  // else here reports a number you could hold steady; a terminal contour only
  // exists relative to the phrase it ends, so this drill cuts speech into
  // phrases, finds the last syllable of each, and scores that.
  //
  // Two segmentations, and they do different jobs:
  //
  //   phrase    — silence longer than PHRASE_GAP_MS. Crude, and adequate only
  //               because the drill asks for one sentence at a time.
  //   syllable  — a dip in loudness, not a gap in voicing. Voicing is the wrong
  //               cue: "know how it ends" barely stops voicing at all, so the
  //               last voiced run was the whole phrase and every ending read as
  //               stretched. Loudness dips at a syllable boundary whether or
  //               not the voice switches off.
  //
  // The verdict is read inside the final syllable alone. Reading it from a
  // fixed window at the end of the phrase got the common case backwards: a
  // question-like ending often *steps down* onto the last syllable before
  // rising through it, so a window spanning the step saw a net fall and called
  // a rise a landing.

  function findFinalSyllable(pts) {
    var i, e = -1;
    for (i = pts.length - 1; i >= 0; i--) { if (pts[i].st != null) { e = i; break; } }
    if (e < 1) return null;
    var env = medianFilter(pts, function (p) { return p.rms; }, SMOOTH_HALF_MS);

    // Walk back from the end, tracking the loudest frame seen. The syllable
    // starts where loudness has fallen to SYLLABLE_DIP of that nucleus. The
    // running maximum is what makes this survive a final syllable quieter than
    // the one before it — the threshold is relative to the syllable being
    // measured, not to the loudest part of the sentence.
    var pk = env[e], s = e, found = false;
    for (i = e - 1; i >= 0; i--) {
      if (pts[e].t - pts[i].t > FINAL_SCAN_MS) break;
      if (env[i] < pk * SYLLABLE_DIP) { found = true; break; }
      if (env[i] > pk) pk = env[i];
      s = i;
    }
    // No dip inside the scan window means the ending ran on into the syllable
    // before it with no boundary to find. The contour is still readable; the
    // duration is not, and is reported as unknown rather than as the scan
    // limit, which would be a made-up number that always looked stretched.
    return { start: pts[s].t, end: pts[e].t, found: found };
  }

  // Direction of the ending, in semitones, read as the difference between the
  // medians of its first and last two-fifths. Medians rather than a slope: the
  // region is short enough that one octave-slip frame swings a regression line,
  // and the shape being detected is monotonic anyway.
  function contourDelta(pts, from, to) {
    if (to - from < CONTOUR_MIN_MS) from = to - CONTOUR_MIN_MS;
    var v = pts.filter(function (p) { return p.st != null && p.t >= from && p.t <= to; });
    if (v.length < 4) return null;
    var span = v[v.length - 1].t - v[0].t;
    if (span < CONTOUR_MIN_MS / 2) return null;
    function part(lo, hi) {
      var w = v.filter(function (p) { return p.t >= v[0].t + span * lo && p.t <= v[0].t + span * hi; });
      return w.length ? median(w.map(function (p) { return p.st; })) : null;
    }
    var a = part(0, 0.4), b = part(0.6, 1);
    return a == null || b == null ? null : b - a;
  }

  function buildIntonation() {
    var html =
      '<div class="card">' +
        '<h3>Statement endings — landing the last syllable</h3>' +
        '<p class="why">Two habits sit on top of pitch and are heard independently of it: holding the ' +
        'final syllable long, and letting it slide upward. Neither needs your range to move, and ' +
        'neither costs your voice anything to change. <b>Read the sentence below, then pause for about ' +
        'a second</b> — the pause is what tells the tool an ending happened.</p>' +

        '<details class="explain"><summary>How to do it, and what is being measured</summary><div>' +
          '<ol class="steps">' +
            '<li>Read the sentence, then <b>pause for about a second</b> — the pause is what tells ' +
              'the tool the sentence ended.</li>' +
            '<li>Keep the last syllable <i>short</i>, and let the pitch drop onto it.</li>' +
            '<li>Aim for eight in a row with no rise.</li>' +
          '</ol>' +
          '<p class="note">Falling is the target and flat is fine; only a rise counts against you. ' +
          'Do not fake the fall by shoving the pitch down at the end — drop it and stop, the way you ' +
          'would if the sentence had simply run out.</p>' +
          DIAGRAMS.terminal() +
          '<p class="note">The trace is drawn in semitones around the sentence’s own average, so ' +
          'it shows the shape of the ending and not where your voice sits — pitch has its own drills. ' +
          'The shaded part is the final syllable, found from a dip in loudness; the verdict is read ' +
          'from that syllable alone.</p>' +
        '</div></details>' +

        '<div class="stack">' +
          '<div class="prompt"><div class="cnt" id="cnt">sentence 1 of ' + STATEMENTS.length + '</div>' +
            '<div class="say" id="say">' + STATEMENTS[0] + '</div></div>' +
          '<canvas id="cont" role="img" aria-label="Pitch contour of the sentence you just read, ' +
            'with the final syllable highlighted"></canvas>' +
          '<div class="verdict" id="verdict"><span class="v">—</span>' +
            '<span class="d">read a sentence, then pause</span></div>' +
        '</div>' +
        '<div class="chips" id="chips"></div>' +
        takeControls('Start take') +
        '<div id="report"></div>' +
      '</div>';

    var view, running = false;
    var pts = [];              // frames of the phrase in progress
    var frozen = null;         // the last scored phrase, kept on screen
    var gapMs = 0, lastTs = null;
    var results = [];

    function setRunning(el, on) {
      running = on;
      if (on) {
        pts = []; results = []; frozen = null;
        gapMs = 0; lastTs = null;
        document.getElementById('report').innerHTML = '';
        setVerdict(null);
        renderChips();
        document.getElementById('status').textContent = 'recording — nothing is saved';
      } else {
        endPhrase();
        document.getElementById('status').textContent = '';
        report();
      }
      el.textContent = on ? 'Stop' : 'Start take';
      el.className = on ? 'recording' : 'primary';
      redraw();
    }

    function prompt() {
      var i = results.length % STATEMENTS.length;
      document.getElementById('cnt').textContent =
        'sentence ' + (i + 1) + ' of ' + STATEMENTS.length +
        (results.length >= STATEMENTS.length ? ' — round ' +
          (Math.floor(results.length / STATEMENTS.length) + 1) : '');
      document.getElementById('say').textContent = STATEMENTS[i];
    }

    function setVerdict(r) {
      var el = document.getElementById('verdict');
      if (!r) {
        el.className = 'verdict';
        el.innerHTML = '<span class="v">—</span><span class="d">' +
          (running ? 'read the sentence, then pause' : 'read a sentence, then pause') + '</span>';
        return;
      }
      var word = r.dir === 'rise' ? 'Rose' : r.dir === 'fall' ? 'Landed' : 'Flat';
      var detail = (r.dir === 'rise' ? 'up ' : r.dir === 'fall' ? 'down ' : 'within ') +
        Math.abs(r.delta).toFixed(1) + ' semitones across the last syllable';
      if (r.hold != null) {
        detail += ' · held ' + r.hold.toFixed(0) + ' ms' +
          (r.hold > HOLD_LONG_MS ? ' — stretched' : '');
      } else {
        detail += ' · length unreadable, it ran into the syllable before it';
      }
      el.className = 'verdict ' + (r.dir === 'rise' ? 'warn' : 'good');
      el.innerHTML = '<span class="v">' + word + '</span><span class="d">' + detail + '</span>';
    }

    function renderChips() {
      var landed = results.filter(function (r) { return r.dir !== 'rise'; }).length;
      var boxes = [];
      for (var i = 0; i < Math.max(STATEMENTS.length, results.length); i++) {
        var r = results[i];
        boxes.push('<span class="chip' + (r ? ' ' + r.dir : '') + '">' +
          (r ? (r.dir === 'rise' ? '↑' : r.dir === 'fall' ? '↓' : '–') : '') + '</span>');
      }
      document.getElementById('chips').innerHTML = boxes.join('') +
        '<span class="cnt">' + landed + ' of ' + results.length + ' landed</span>';
    }

    function endPhrase() {
      var phrase = pts;
      pts = [];
      var voiced = phrase.filter(function (p) { return p.st != null; });
      // A cough, a door, or the tail of the sentence before is not a phrase.
      if (voiced.length < 4 || voiced[voiced.length - 1].t - voiced[0].t < MIN_PHRASE_MS) return;

      // Score the de-spiked copy; keep the raw one for the drawing, which
      // smooths it the same way when it draws.
      var st = medianFilter(phrase, function (p) { return p.st; }, SMOOTH_HALF_MS);
      var clean = phrase.map(function (p, i) { return { t: p.t, st: st[i], rms: p.rms }; });
      var syl = findFinalSyllable(clean);
      if (!syl) return;
      var delta = contourDelta(clean, syl.start, syl.end);
      if (delta == null) return;

      var r = {
        delta: delta,
        hold: syl.found ? syl.end - syl.start : null,
        dir: delta >= TERMINAL_ST ? 'rise' : delta <= -TERMINAL_ST ? 'fall' : 'flat',
        from: Math.min(syl.start, syl.end - CONTOUR_MIN_MS),
        to: syl.end
      };
      results.push(r);
      // Without trimming, every frozen sentence carries the quarter-second of
      // silence that ended it and the line stops short of the right edge.
      while (phrase.length && phrase[phrase.length - 1].st == null) phrase.pop();
      frozen = { pts: phrase, mark: r };
      setVerdict(r);
      renderChips();
      prompt();
    }

    // While a sentence is being spoken it draws itself; the moment it ends the
    // scored version replaces it and stays put, because a contour you cannot
    // look at afterwards is not feedback.
    function redraw() {
      // A sentence in progress is drawn against a fixed span so the line grows
      // steadily instead of rescaling under you; a finished one is stretched to
      // the width, since by then its length is known.
      if (pts.length) view.draw(pts, false, 2200);
      else if (frozen) view.draw(frozen.pts, frozen.mark, 0);
      else view.draw(null, running ? false : null);
    }

    return {
      html: html,
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false);
      },
      mount: function () {
        view = new Contour(document.getElementById('cont'));
        view.resize();
        prompt();
        renderChips();
        redraw();
        document.getElementById('go').onclick = function () { setRunning(this, !running); };
      },
      frame: function (a, ts) {
        if (running) {
          var dt = lastTs == null ? 0 : Math.min(100, ts - lastTs);
          lastTs = ts;
          // Raw per-frame pitch, not the shared smoother. That smoother is a
          // median of five *frames*, which is 83 ms at 60 Hz and over 200 ms on
          // a slow one — long enough to flatten a final syllable that only
          // lasts a quarter of a second, and it was attenuating real rises into
          // "flat". The contour does its own smoothing over a fixed 50 ms
          // window instead, which the octave-slip test covers.
          if (a.voiced && a.f0) {
            gapMs = 0;
            if (!pts.length) frozen = null;   // a new sentence clears the old one
            pts.push({ t: ts, st: DSP.hzToSemitones(a.f0), rms: a.rms });
          } else {
            gapMs += dt;
            if (pts.length) {
              if (gapMs >= PHRASE_GAP_MS) endPhrase();
              else pts.push({ t: ts, st: null, rms: a.rms });
            }
          }
        }
        // Redrawn even when stopped, so the scored sentence survives the window
        // being resized while you are looking at it.
        redraw();
      }
    };

    function report() {
      var el = document.getElementById('report');
      if (results.length < 3) {
        el.innerHTML = '<div class="banner err" style="margin-top:14px">Only ' + results.length +
          ' sentence' + (results.length === 1 ? '' : 's') + ' scored. Read several, leaving about a ' +
          'second of silence between them.</div>';
        return;
      }
      var rises = results.filter(function (r) { return r.dir === 'rise'; }).length;
      var holds = results.filter(function (r) { return r.hold != null; })
        .map(function (r) { return r.hold; });
      var longs = holds.filter(function (h) { return h > HOLD_LONG_MS; }).length;
      el.innerHTML =
        '<table style="margin-top:16px"><tr><th>Measure</th><th>This take</th><th>Target</th><th></th></tr>' +
        '<tr><td>Endings that rose</td><td class="num">' + rises + ' of ' + results.length +
          '</td><td class="num">0</td><td class="' + (rises === 0 ? 'ok' : 'no') + '">' +
          (rises === 0 ? 'on target' : 'keep working') + '</td></tr>' +
        (holds.length
          ? '<tr><td>Median final syllable</td><td class="num">' + median(holds).toFixed(0) +
            ' ms</td><td class="num">under ' + HOLD_LONG_MS + ' ms</td><td class="' +
            (longs === 0 ? 'ok' : 'no') + '">' + (longs === 0 ? 'on target' : longs + ' stretched') +
            '</td></tr>'
          : '<tr><td>Median final syllable</td><td class="num">—</td><td class="num">under ' +
            HOLD_LONG_MS + ' ms</td><td>no clean boundary found</td></tr>') +
        '</table>' +
        '<div class="hint">Not saved to <b>Progress</b>: this is a shape rather than a level, and it ' +
        'only means anything against the sentences on this page. The transfer test is whether the ' +
        'endings still land in <b>Free speech</b>, where nothing is prompting you.</div>';
    }
  }

  // --- reading passage ------------------------------------------------------

  function buildPassage() {
    var html =
      '<div class="card">' +
        '<h3>Reading passage</h3>' +
        '<p class="why">Connected speech is the real test. Resonance is only meaningful when averaged ' +
        'over many vowels, so this take is compared against your calibration reading of the same ' +
        'passage — like for like.</p>' +
        // The text you are reading and the trace of you reading it belong to
        // each other, so they share one bordered block rather than two cards.
        '<div class="stack">' +
          '<div class="prompt"><div class="cnt">read aloud</div>' +
            '<div class="say" style="font-size:16.5px;line-height:1.7">' + PASSAGE + '</div></div>' +
          '<canvas id="rib" role="img" aria-label="Live pitch trace"></canvas>' +
        '</div>' +
        '<div class="meters">' + meter('m-pitch', 'Pitch', '', true) + meter('m-res', 'Resonance', '', true) +
          meter('m-weight', 'Weight') + meter('m-int', 'Intonation') + '</div>' +
        takeControls('Start take') +
        '<div id="report"></div>' +
      '</div>';

    var rib, running = false, f0s = [], resList = [], weights = [], band = null;
    var voicedMs = 0, lastTs = null;

    function setRunning(el, on, score) {
      running = on;
      el.textContent = on ? 'Stop and score' : 'Start take';
      el.className = on ? 'recording' : 'primary';
      if (on) {
        f0s = []; resList = []; weights = []; rib.pts = [];
        voicedMs = 0; lastTs = null;
        intonation.reset();
        document.getElementById('report').innerHTML = '';
        document.getElementById('status').textContent = 'recording — audio is never saved';
      } else {
        document.getElementById('status').textContent = '';
        if (score) report();
      }
    }

    return {
      html: html,
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false, true);
      },
      mount: function () {
        rib = new Ribbon(document.getElementById('rib'));
        rib.resize();
        band = targetBand();
        rib.draw(band);
        document.getElementById('go').onclick = function () { setRunning(this, !running, true); };
      },
      frame: function (a) {
        var f0 = smoothF0.value();
        var res = smoothRes.value();
        setMeter('m-pitch', f0 ? f0.toFixed(0) + ' Hz' : '--',
          band ? 'target ' + band.center.toFixed(0) : '',
          { hit: band && f0 && f0 >= band.lo && f0 <= band.hi,
            fill: f0 ? pitchFill(f0) : 0, markAt: band ? pitchFill(band.center) : null });
        setMeter('m-res', res ? res.toFixed(1) + ' cm' : '--', resonanceSub(res), resonanceMeterOpts(res));
        setMeter('m-weight', weightLabel(smoothWeight.value()), weightSub(smoothWeight.value()));
        var sd = intonation.sd();
        setMeter('m-int', sd != null ? sd.toFixed(1) + ' st' : '--', 'flatter reads more masculine');
        if (running) {
          var dt = lastTs == null ? 0 : Math.min(100, performance.now() - lastTs);
          lastTs = performance.now();
          if (a.voiced && f0) {
            voicedMs += dt;
            f0s.push(f0);
            if (a.resonance != null) resList.push(a.resonance);
            if (a.weightRaw != null) weights.push(a.weightRaw);
          }
          rib.push(a.voiced ? f0 : 0);
          rib.draw(band);
        }
      }
    };

    function report() {
      if (voicedMs < MIN_VOICED_MS_SCORE) {
        document.getElementById('report').innerHTML =
          '<div class="banner err" style="margin-top:14px">Only ' + (voicedMs / 1000).toFixed(1) +
          ' s of voiced speech — too little to score. Read the whole passage.</div>';
        return;
      }
      var mF0 = median(f0s);
      var mRes = resList.length >= MIN_FRAMES_FOR_MEDIAN ? median(resList) : null;
      var mW = weights.length >= MIN_FRAMES_FOR_MEDIAN ? median(weights) : null;
      var sd = semitoneSd(f0s);
      var rows = [];
      function line(name, val, target, good) {
        rows.push('<tr><td>' + name + '</td><td class="num">' + val + '</td><td class="num">' + target +
          '</td><td class="' + (good ? 'ok' : 'no') + '">' + (good ? 'on target' : 'keep working') + '</td></tr>');
      }
      var t = pitchTarget();
      line('Pitch', mF0.toFixed(0) + ' Hz', t ? t.hz.toFixed(0) + ' Hz' : '—', t && mF0 <= t.hz * 1.06);
      if (mRes != null && base.resonance != null) {
        line('Resonance', mRes.toFixed(1) + ' cm', (base.resonance * RESONANCE_GOAL).toFixed(1) + ' cm',
          mRes >= base.resonance * RESONANCE_GOAL);
      }
      if (mW != null && base.weight != null) {
        line('Weight', (mW - base.weight >= 0 ? '+' : '') + (mW - base.weight).toFixed(1),
          'at or above baseline', mW >= base.weight);
      }
      if (sd != null && base.intonationSd != null) {
        line('Intonation', sd.toFixed(1) + ' st', '≤ ' + base.intonationSd.toFixed(1) + ' st', sd <= base.intonationSd);
      }
      recordTake('passage', { f0: mF0, res: mRes, weight: mW, sd: sd });
      document.getElementById('report').innerHTML =
        '<table style="margin-top:16px"><tr><th>Measure</th><th>This take</th><th>Target</th><th></th></tr>' +
        rows.join('') + '</table>' +
        '<div class="hint">Compared against your own calibration on this same passage, so vowel content ' +
        'matches. Resonance measured on a different text is not comparable. ' +
        'Saved to <b>Progress</b>.</div>';
    }
  }

  // --- free speech ----------------------------------------------------------

  function buildFree() {
    var html =
      '<div class="card">' +
        '<h3>Free speech</h3>' +
        '<p class="why">Live meters are useful for drilling and actively harmful for conversation — ' +
        'watching a number pulls you out of speaking. Talk for a minute about anything, with nothing ' +
        'to look at, and read the result afterwards.</p>' +
        takeControls('Start talking') +
        '<div id="report"></div>' +
      '</div>';

    var running = false, f0s = [], resList = [], weights = [], t0 = 0;
    var voicedMs = 0, lastTs = null;

    function setRunning(el, on) {
      running = on;
      el.textContent = on ? 'Stop and score' : 'Start talking';
      el.className = on ? 'recording' : 'primary';
      if (on) {
        f0s = []; resList = []; weights = []; t0 = performance.now();
        voicedMs = 0; lastTs = null;
        intonation.reset();
        document.getElementById('report').innerHTML = '';
      } else {
        document.getElementById('status').textContent = '';
        report();
      }
    }

    return {
      html: html,
      abort: function () {
        if (running) setRunning(document.getElementById('go'), false);
      },
      mount: function () {
        document.getElementById('go').onclick = function () { setRunning(this, !running); };
      },
      frame: function (a, ts) {
        if (!running) return;
        var f0 = smoothF0.value();
        var dt = lastTs == null ? 0 : Math.min(100, ts - lastTs);
        lastTs = ts;
        if (a.voiced && f0) {
          voicedMs += dt;
          f0s.push(f0);
          if (a.resonance != null) resList.push(a.resonance);
          if (a.weightRaw != null) weights.push(a.weightRaw);
        }
        document.getElementById('status').textContent =
          ((performance.now() - t0) / 1000).toFixed(0) + ' s — no meters on purpose';
      }
    };

    function report() {
      if (voicedMs < MIN_VOICED_MS_SCORE) {
        document.getElementById('report').innerHTML =
          '<div class="banner err" style="margin-top:14px">Only ' + (voicedMs / 1000).toFixed(1) +
          ' s of voiced speech — too little to score. Talk for a bit longer.</div>';
        return;
      }
      var mF0 = median(f0s), sd = semitoneSd(f0s);
      var mRes = resList.length >= MIN_FRAMES_FOR_MEDIAN ? median(resList) : null;
      var mW = weights.length >= MIN_FRAMES_FOR_MEDIAN ? median(weights) : null;
      var t = pitchTarget();
      recordTake('free', { f0: mF0, res: mRes, weight: mW, sd: sd });
      var html = '<table style="margin-top:16px"><tr><th>Measure</th><th>This take</th><th>Reference</th></tr>' +
        '<tr><td>Median pitch</td><td class="num">' + mF0.toFixed(0) + ' Hz</td><td class="num">target ' +
          (t ? t.hz.toFixed(0) : '—') + ' Hz</td></tr>' +
        (mRes != null ? '<tr><td>Resonance</td><td class="num">' + mRes.toFixed(1) + ' cm</td><td class="num">baseline ' +
          (base.resonance != null ? base.resonance.toFixed(1) : '—') + ' cm</td></tr>' : '') +
        (mW != null && base.weight != null ? '<tr><td>Weight</td><td class="num">' +
          (mW - base.weight >= 0 ? '+' : '') + (mW - base.weight).toFixed(1) + '</td><td class="num">baseline</td></tr>' : '') +
        (sd != null ? '<tr><td>Intonation</td><td class="num">' + sd.toFixed(1) + ' st</td><td class="num">baseline ' +
          (base.intonationSd != null ? base.intonationSd.toFixed(1) : '—') + ' st</td></tr>' : '') +
        '</table>' +
        '<div class="hint">Spontaneous speech usually sits higher than drilled speech. That gap is the ' +
        'real measure of how far the training has carried. Saved to <b>Progress</b>.</div>';
      document.getElementById('report').innerHTML = html;
    }
  }

  // --- progress -------------------------------------------------------------

  // What each chart plots, and what counts as "better". Resonance is restricted
  // to the passage takes because it is only comparable across the same text —
  // the same reason the passage report compares against the calibration read.
  function progressMetrics() {
    var t = pitchTarget();
    return [
      { id: 'f0', label: 'Pitch', unit: ' Hz', dp: 0, lower: true,
        ref: t ? t.hz : null, refLabel: 'target' },
      { id: 'res', label: 'Resonance', unit: ' cm', dp: 1, lower: false,
        ref: base.resonance != null ? base.resonance * RESONANCE_GOAL : null, refLabel: 'goal',
        passageOnly: true },
      { id: 'sd', label: 'Intonation', unit: ' st', dp: 1, lower: true,
        ref: base.intonationSd, refLabel: 'baseline' },
      { id: 'weight', label: 'Weight', unit: '', dp: 1, lower: false,
        ref: base.weight, refLabel: 'baseline' }
    ];
  }

  var KIND_LABEL = { calibration: 'Calibration', passage: 'Passage', free: 'Free speech' };
  var KIND_COLOR = { calibration: '#8f97ad', passage: '#6ea8ff', free: '#f0b45e' };

  function buildProgress() {
    var metrics = progressMetrics().filter(function (m) {
      return history.some(function (h) { return h[m.id] != null; });
    });
    if (!metrics.length) {
      return {
        html:
          '<div class="card">' +
            '<h3>Progress</h3>' +
            '<p class="why">Scored takes are kept in this browser so you can see whether the numbers ' +
            'are actually moving. Nothing here is uploaded, and no audio is stored — only the four ' +
            'medians and the date.</p>' +
            '<div class="banner info" style="margin:0">No scored takes yet. The <b>reading passage</b> ' +
            'and <b>free speech</b> exercises each save one take when you press <i>Stop and score</i>; ' +
            'your calibration reading is saved as the first point.</div>' +
          '</div>'
      };
    }

    var sel = metrics[0].id;

    var html =
      '<div class="card">' +
        '<h3>Progress</h3>' +
        '<p class="why">Every scored take, oldest first. Practice moves slowly and unevenly — a single ' +
        'take says almost nothing, and the line across a few weeks says everything. Nothing here is ' +
        'uploaded; only the medians and the date are kept, in this browser.</p>' +
        '<div class="row" id="metricRow" style="margin-top:0">' +
          metrics.map(function (m) {
            return '<button data-metric="' + m.id + '"' + (m.id === sel ? ' class="primary"' : '') +
              '>' + m.label + '</button>';
          }).join('') +
        '</div>' +
        '<canvas id="progCanvas" class="trace" style="height:230px;margin-top:14px" role="img" ' +
          'aria-label="Scored takes over time"></canvas>' +
        '<div id="progSummary" class="hint"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3 style="font-size:15px">Takes</h3>' +
        '<div style="max-height:340px;overflow:auto">' + takeTable() + '</div>' +
        '<div class="row"><button id="clearHist">Delete take history</button>' +
          '<span style="color:var(--dim);font-size:12.5px">Your calibration is kept.</span></div>' +
      '</div>';

    var cv, g, onResize = null;

    function series(m) {
      return history.filter(function (h) {
        return h[m.id] != null && !(m.passageOnly && h.kind === 'free');
      });
    }

    function draw() {
      var m = metrics.filter(function (x) { return x.id === sel; })[0];
      var pts = series(m);
      var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(r.width * dpr)) {
        cv.width = r.width * dpr; cv.height = r.height * dpr;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      var w = r.width, h = r.height;
      g.clearRect(0, 0, w, h);
      g.fillStyle = '#0e1016'; g.fillRect(0, 0, w, h);
      g.font = '11px system-ui';

      if (!pts.length) {
        g.fillStyle = 'rgba(143,151,173,.8)';
        g.fillText('No takes with a ' + m.label.toLowerCase() + ' reading yet.', 10, h / 2);
        document.getElementById('progSummary').textContent = '';
        return;
      }

      // The reference line is part of the picture, so the scale has to include
      // it — a chart that crops the target off the top implies you are there.
      var vals = pts.map(function (p) { return p[m.id]; });
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
      if (m.ref != null) { lo = Math.min(lo, m.ref); hi = Math.max(hi, m.ref); }
      var pad = (hi - lo) * 0.18 || Math.max(Math.abs(hi) * 0.05, 0.5);
      lo -= pad; hi += pad;

      var padL = 46, padR = 12, padT = 12, padB = 22;
      function x(i) {
        return pts.length === 1 ? padL + (w - padL - padR) / 2
          : padL + i / (pts.length - 1) * (w - padL - padR);
      }
      function y(v) { return padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB); }

      // y axis
      g.strokeStyle = 'rgba(46,52,70,.9)'; g.lineWidth = 1;
      g.fillStyle = 'rgba(143,151,173,.75)';
      [lo + pad, (lo + hi) / 2, hi - pad].forEach(function (v) {
        var yy = Math.round(y(v)) + 0.5;
        g.beginPath(); g.moveTo(padL, yy); g.lineTo(w - padR, yy); g.stroke();
        g.fillText(v.toFixed(m.dp), 6, yy + 4);
      });

      if (m.ref != null) {
        var yr = y(m.ref);
        g.strokeStyle = 'rgba(90,211,154,.55)'; g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(padL, yr); g.lineTo(w - padR, yr); g.stroke();
        g.setLineDash([]);
        g.fillStyle = 'rgba(90,211,154,.9)';
        var lbl = m.refLabel + ' ' + m.ref.toFixed(m.dp) + m.unit;
        g.fillText(lbl, w - padR - g.measureText(lbl).width, yr - 5);
      }

      g.strokeStyle = 'rgba(110,168,255,.75)'; g.lineWidth = 2;
      g.beginPath();
      pts.forEach(function (p, i) {
        var xx = x(i), yy = y(p[m.id]);
        if (i) g.lineTo(xx, yy); else g.moveTo(xx, yy);
      });
      g.stroke();

      pts.forEach(function (p, i) {
        g.fillStyle = KIND_COLOR[p.kind] || '#6ea8ff';
        g.beginPath(); g.arc(x(i), y(p[m.id]), 3.5, 0, Math.PI * 2); g.fill();
      });

      g.fillStyle = 'rgba(143,151,173,.75)';
      g.fillText(shortDate(pts[0].t), padL, h - 6);
      if (pts.length > 1) {
        var last = shortDate(pts[pts.length - 1].t);
        g.fillText(last, w - padR - g.measureText(last).width, h - 6);
      }

      summarise(m, pts);
    }

    // Change since the first take, stated in the direction that is actually an
    // improvement for the metric — "down 11 Hz" is progress, "down 0.4 cm" is not.
    function summarise(m, pts) {
      var el = document.getElementById('progSummary');
      if (pts.length < 2) {
        el.innerHTML = 'One take so far. A second one gives you a line.';
        return;
      }
      var first = pts[0][m.id], last = pts[pts.length - 1][m.id];
      var d = last - first;
      var better = m.lower ? d < 0 : d > 0;
      var word = Math.abs(d) < Math.pow(10, -m.dp) / 2 ? 'unchanged' :
        (better ? 'toward your goal' : 'away from your goal');
      el.innerHTML = pts.length + ' takes since ' + shortDate(pts[0].t) + '. ' +
        m.label + ' ' + (d >= 0 ? '+' : '') + d.toFixed(m.dp) + m.unit +
        ' <span class="' + (word === 'unchanged' ? '' : better ? 'ok' : 'no') + '">' + word + '</span>' +
        (m.passageOnly ? ' — free-speech takes are left out, since resonance only compares on the same text.' : '');
    }

    return {
      html: html,
      mount: function () {
        cv = document.getElementById('progCanvas');
        g = cv.getContext('2d');
        draw();
        Array.prototype.forEach.call(document.querySelectorAll('#metricRow button'), function (b) {
          b.onclick = function () {
            sel = b.dataset.metric;
            Array.prototype.forEach.call(document.querySelectorAll('#metricRow button'), function (o) {
              o.className = o === b ? 'primary' : '';
            });
            draw();
          };
        });
        document.getElementById('clearHist').onclick = function () {
          if (!confirm('Delete all ' + history.length + ' saved takes? Your calibration is kept.')) return;
          clearHistory();
          openExercise('progress');
        };
        onResize = function () { draw(); };
        window.addEventListener('resize', onResize);
      },
      abort: function () {
        if (onResize) window.removeEventListener('resize', onResize);
        onResize = null;
      }
    };
  }

  function takeTable() {
    var t = pitchTarget();
    var rows = history.slice().reverse().map(function (h) {
      function cell(v, dp, unit) {
        return '<td class="num">' + (v == null ? '—' : v.toFixed(dp) + unit) + '</td>';
      }
      return '<tr><td class="num">' + shortDate(h.t) + '</td>' +
        '<td>' + (KIND_LABEL[h.kind] || h.kind) + '</td>' +
        '<td class="num' + (t && h.f0 != null && h.f0 <= t.hz * 1.06 ? ' ok' : '') + '">' +
          (h.f0 == null ? '—' : h.f0.toFixed(0) + ' Hz') + '</td>' +
        cell(h.res, 1, ' cm') +
        cell(h.sd, 1, ' st') +
        (h.weight != null && base.weight != null
          ? '<td class="num">' + (h.weight - base.weight >= 0 ? '+' : '') +
            (h.weight - base.weight).toFixed(1) + '</td>'
          : '<td class="num">—</td>') +
        '</tr>';
    });
    return '<table><tr><th>When</th><th>Take</th><th>Pitch</th><th>Resonance</th>' +
      '<th>Intonation</th><th>Weight</th></tr>' + rows.join('') + '</table>';
  }

  function shortDate(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  // ==========================================================================
  // boot
  // ==========================================================================

  document.getElementById('micBtn').onclick = function () {
    if (audio.running) stopMic(); else startMic();
  };
  document.getElementById('resetBtn').onclick = function () {
    // Old takes are scored against the old baseline, so keeping them across a
    // recalibration would put two different reference frames on one chart.
    if (!confirm('Clear your saved baseline, targets, and all ' + history.length +
      ' saved takes?')) return;
    base = {};
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    clearHistory();
    save();
    openExercise('calibrate');
  };
  renderBaseTable();
  renderExList();
  openExercise(base.habitualF0 == null ? 'calibrate' : 'straw');
})();
</script>

<script>
  // Installable + offline. Service workers are unavailable over file://, which
  // is still a perfectly good way to open this page, so the failure is silent.
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
