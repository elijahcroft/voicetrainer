<!--
  index.html — voice masculinization practice with live acoustic feedback.

  Open this file directly in Chrome (File > Open, or drag it in). Nothing is
  installed, nothing is uploaded, and no audio is recorded or stored — every
  frame is analysed and discarded. Only your calibration numbers and the scores
  of each take — four medians and a date — are saved, in this browser's
  localStorage.

  If the microphone will not start from file://, serve the folder instead:
      python3 -m http.server
  then open http://localhost:8000/index.html

  The DSP lives in dsp.js and is verified by test-dsp.mjs (node test-dsp.mjs).
  The statement-endings measurement is verified by test-endings.mjs, which pulls
  its functions out of this file so the two cannot drift apart.
  See RESEARCH.md for the studies behind the targets.
-->
<meta charset="utf-8">
<title>Voice Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice">
<script src="dsp.js"></script>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --panel-2: #222634;
    --line: #2e3446;
    --text: #e6e9f2;
    --dim: #8f97ad;
    --accent: #6ea8ff;
    --good: #5ad39a;
    --warn: #f0b45e;
    --bad: #ef6f6f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 16px; cursor: pointer;
    transition: border-color .12s, background .12s, filter .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  button.recording { background: rgba(239,111,111,.14); border-color: var(--bad); color: #ffc9c9; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: rgba(26,29,38,.86); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .mic-state {
    font-size: 12.5px; color: var(--dim); display: flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px 4px 10px;
  }
  .mic-state.live { border-color: rgba(90,211,154,.4); color: #a8e8c9; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555c70; flex-shrink: 0; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 0 rgba(90,211,154,.6); animation: pulse 2s ease-out infinite; }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 7px rgba(90,211,154,0); }
    100% { box-shadow: 0 0 0 0 rgba(90,211,154,0); }
  }
  .spacer { flex: 1; }

  /* Grid rather than flex so the numbers panel can sit beside the exercise on
     a wide screen and below it on a phone, where a table above the exercise
     would push the thing you came to use off the bottom of the fold. */
  .layout {
    display: grid; gap: 22px; padding: 22px 20px 48px;
    grid-template-columns: 250px minmax(0, 1fr);
    grid-template-areas: "nav main" "numbers main";
    align-items: start; align-content: start;
    max-width: 1240px; margin: 0 auto;
  }
  nav { grid-area: nav; }
  aside.numbers { grid-area: numbers; }
  main { grid-area: main; }

  nav h2, aside.numbers h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 8px 4px; }
  .ex {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; margin-bottom: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
    position: relative;
  }
  .ex.active { border-color: var(--accent); background: var(--panel-2); }
  .ex.active::before {
    content: ''; position: absolute; left: -1px; top: 9px; bottom: 9px;
    width: 3px; border-radius: 3px; background: var(--accent);
  }
  .ex .n {
    flex-shrink: 0; width: 21px; height: 21px; border-radius: 6px; margin-top: 1px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .ex.active .n { background: var(--accent); border-color: var(--accent); color: #0d1117; }
  .ex.done .n { border-color: rgba(90,211,154,.5); color: var(--good); }
  .ex .t { font-weight: 600; font-size: 13.5px; }
  .ex .s { font-size: 12px; color: var(--dim); margin-top: 1px; line-height: 1.4; }
  .locked-note { font-size: 11.5px; color: var(--dim); margin: 6px 0 0 4px; }

  @media (max-width: 860px) {
    .layout {
      padding: 16px 14px 40px; gap: 16px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "nav" "main" "numbers";
    }
    #exList { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    #exList .ex { width: auto; min-width: 172px; flex-shrink: 0; margin-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }

  main { flex: 1; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 5px; font-size: 19px; letter-spacing: -.01em; }
  .why { color: var(--dim); font-size: 13.5px; margin: 0 0 14px; max-width: 68ch; }
  .steps { margin: 0 0 4px; padding-left: 21px; max-width: 62ch; }
  .steps li { margin-bottom: 7px; }
  .steps li::marker { color: var(--dim); font-variant-numeric: tabular-nums; }
  /* Diagnosis and caveats read as steps when they sit inside the list, so they
     live below it instead — you can follow the numbers with your mouth busy. */
  .note { font-size: 13px; color: var(--dim); margin: 12px 0 0; max-width: 66ch; }
  .note b { color: var(--text); font-weight: 600; }

  .diagram {
    margin: 16px 0 0; padding: 14px 16px 12px;
    background: #0e1016; border: 1px solid var(--line); border-radius: 10px;
  }
  .diagram .dwrap { margin: 0 auto; }
  .diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
  /* The rule spans the whole figure; the text inside it stops at a readable
     measure, which is why the caption is a block wrapping an inner span. */
  .diagram figcaption {
    font-size: 12.5px; color: var(--dim); line-height: 1.5;
    margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .diagram figcaption span { display: block; max-width: 70ch; }

  canvas { width: 100%; display: block; border-radius: 9px; background: #0e1016; }

  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .meter { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; transition: border-color .15s; }
  .meter .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .meter .val { font-family: var(--mono); font-size: 25px; font-weight: 600; margin: 3px 0 2px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .meter .sub { font-size: 12px; color: var(--dim); min-height: 17px; }
  .meter.muted { opacity: .38; }
  .meter.hit { border-color: rgba(90,211,154,.45); }
  .meter.hit .val { color: var(--good); }
  .meter.idle .val { color: var(--dim); }

  .bar { height: 6px; background: #0e1016; border-radius: 4px; margin-top: 9px; position: relative; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .09s linear, background .15s; }
  .meter.hit .bar > i { background: var(--good); }
  .bar > u { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); border-radius: 2px; }

  .banner { padding: 11px 15px; border-radius: 9px; font-size: 13.5px; margin-bottom: 16px; border: 1px solid; }
  .banner.compact { padding: 9px 14px; font-size: 12.5px; display: flex; gap: 9px; align-items: flex-start; }
  .banner.compact b { font-weight: 650; }
  /* display:flex above would otherwise beat the UA rule for [hidden]. */
  .banner[hidden] { display: none; }
  .banner.safety { background: rgba(240,180,94,.09); border-color: rgba(240,180,94,.35); color: #f3cd94; }
  .banner.info { background: rgba(110,168,255,.09); border-color: rgba(110,168,255,.35); color: #b8d3ff; }
  .banner.err { background: rgba(239,111,111,.1); border-color: rgba(239,111,111,.4); color: #ffb3b3; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .passage { background: #0e1016; border-radius: 9px; padding: 15px 17px; font-size: 16.5px; line-height: 1.75; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  td, th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ok { color: var(--good); } .no { color: var(--warn); }
  .hint { font-size: 12.5px; color: var(--dim); margin-top: 10px; }

  /* Statement endings. Prompt, contour and verdict are one bordered stack on
     purpose: you read the sentence, look down two centimetres, and see what the
     ending did. Spreading them across separate cards put the feedback far
     enough from the prompt that you had to hunt for it. */
  .stack { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0e1016; }
  .stack .prompt { padding: 13px 17px 15px; border-bottom: 1px solid var(--line); }
  .stack .prompt .cnt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .stack .prompt .say { font-size: 20px; line-height: 1.4; margin-top: 3px; }
  .stack canvas { display: block; width: 100%; height: 188px; }
  /* A trace that is not inside a stack still needs its own edge, now that it
     shares a card with the text above it. */
  .trace { display: block; width: 100%; height: 200px; background: #0e1016;
           border: 1px solid var(--line); border-radius: 10px; }
  .verdict { display: flex; gap: 11px; align-items: baseline; flex-wrap: wrap;
             padding: 11px 17px; background: var(--panel-2); border-top: 1px solid var(--line); }
  .verdict .v { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--dim); }
  .verdict .d { font-size: 12.5px; color: var(--dim); }
  .verdict.good .v { color: var(--good); }
  .verdict.warn .v { color: var(--warn); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .chip { width: 27px; height: 27px; border-radius: 7px; display: grid; place-items: center;
          font-size: 14px; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); }
  .chip.fall { color: var(--good); border-color: rgba(90,211,154,.45); }
  .chip.rise { color: var(--warn); border-color: rgba(240,180,94,.45); }
  .chips .cnt { font-size: 12.5px; color: var(--dim); margin-left: 4px; }

  /* The explanation matters once, and is in the way every session after that. */
  .explain { margin: 0 0 14px; }
  .explain > summary { cursor: pointer; color: var(--dim); font-size: 13px; list-style: none;
                       display: inline-flex; gap: 6px; align-items: center; }
  .explain > summary::-webkit-details-marker { display: none; }
  .explain > summary::before { content: "▸"; font-size: 11px; }
  .explain[open] > summary::before { content: "▾"; }
  .explain > summary:hover { color: var(--text); }
  .explain > div { padding-top: 12px; }
  code { font-family: var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: .92em; }

  /* Installed on a phone the page owns the whole screen, notch and home bar
     included, so keep the sticky header and the last row clear of both. */
  header { padding-top: calc(12px + env(safe-area-inset-top));
           padding-left: calc(20px + env(safe-area-inset-left));
           padding-right: calc(20px + env(safe-area-inset-right)); }
  .layout { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
</style>

<header>
  <h1>Voice Trainer</h1>
  <div class="mic-state" id="micState" aria-live="polite"><span class="dot" id="dot"></span><span id="micLabel">microphone off</span></div>
  <div class="spacer"></div>
  <button id="micBtn" class="primary">Start microphone</button>
  <button id="resetBtn" title="Clear saved calibration and take history">Reset calibration</button>
</header>

<div class="layout">
  <nav aria-label="Practice exercises">
    <h2>Practice</h2>
    <div id="exList"></div>
  </nav>

  <aside class="numbers">
    <h2>Your numbers</h2>
    <div class="card" style="padding:13px 15px;margin:0">
      <table id="baseTable"><tbody></tbody></table>
    </div>
  </aside>

  <main>
    <div class="banner safety compact">
      <span aria-hidden="true">⚠</span>
      <span><b>Stop if you feel throat tightness, pain, or hoarseness.</b> Forcing pitch downward is the
      main way voice practice causes injury — resonance and weight do more for how masculine a voice
      reads than pitch does, and they cost your voice nothing.</span>
    </div>
    <div id="errBox"></div>
    <div id="pane"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // ==========================================================================
  // constants grounded in the literature (see RESEARCH.md)
  // ==========================================================================

  var MASC_F0_CEILING = 130;   // below this, listeners reliably hear "male"
  var ANDROGYNOUS_LOW = 140;   // 140-165 Hz is the ambiguous zone where
  var ANDROGYNOUS_HIGH = 165;  // gender recognition accuracy collapses
  var FLOOR_MARGIN_ST = 3;     // never target within 3 semitones of the bottom
  var RESONANCE_GOAL = 1.10;   // cis male vocal tracts run 10-20% longer

  // Phrase-final contour, used only by the statement-endings drill. A phrase is
  // whatever sits between two long silences; inside it, the final syllable is
  // found from the loudness envelope and the verdict is read from that syllable
  // alone. The thresholds are judgement calls, not measured cut-points — see
  // RESEARCH.md §5.
  var PHRASE_GAP_MS = 260;     // silence that ends a phrase
  var MIN_PHRASE_MS = 400;     // shorter than this is a cough, not a sentence
  var FINAL_SCAN_MS = 700;     // how far back to look for the final syllable
  var SYLLABLE_DIP = 0.5;      // loudness dip, relative to the nucleus, that marks its start
  var CONTOUR_MIN_MS = 250;    // a shorter syllable is padded backwards to read its shape
  var TERMINAL_ST = 1.0;       // smaller than this in either direction is "flat"
  var HOLD_LONG_MS = 350;      // final syllable longer than this reads stretched

  // How much *voiced* speech a measurement needs, in milliseconds. These were
  // frame counts, which made them depend on the display: 120 frames is two
  // seconds on a 60 Hz screen and one on a 120 Hz one, and far longer if the
  // browser throttles requestAnimationFrame. Time is the quantity that was
  // always meant.
  var MIN_VOICED_MS_CALIBRATE = 5000;
  var MIN_VOICED_MS_SCORE = 2000;
  var MIN_FRAMES_FOR_MEDIAN = 20;   // frames, correctly: enough samples to median

  var STORE_KEY = 'voice-trainer-baseline-v1';
  var HISTORY_KEY = 'voice-trainer-history-v1';
  var MAX_TAKES = 300;         // ~a year of daily practice; oldest are dropped

  // ==========================================================================
  // audio
  // ==========================================================================

  var audio = { ctx: null, analyser: null, stream: null, buf: null, running: false };
  var latest = null;               // most recent analysed frame
  var smoothF0 = new DSP.MedianSmoother(5);
  var smoothRes = new DSP.MedianSmoother(31);   // resonance is noisy; ~0.5 s
  var smoothWeight = new DSP.MedianSmoother(31);
  var intonation = new DSP.RollingStats(10000);

  // Frames of continuous silence before the smoothers are cleared. A held vowel
  // drops the odd frame, so clearing on the first unvoiced one would throw away
  // the median mid-note; leaving them forever is worse — the resonance and
  // weight meters would keep displaying a number long after you stopped making
  // any sound, which is the one thing a biofeedback readout must never do.
  var SILENCE_FRAMES_TO_CLEAR = 12;   // ~200 ms
  var unvoicedRun = 0;

  function resetSmoothers() {
    smoothF0.reset(); smoothRes.reset(); smoothWeight.reset();
    unvoicedRun = 0;
  }

  function setMicUI(on, label) {
    document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
    document.getElementById('micLabel').textContent = label;
    document.getElementById('micState').classList.toggle('live', on);
    document.getElementById('micBtn').textContent = on ? 'Stop microphone' : 'Start microphone';
    syncMicControls();
  }

  // Exercise controls that cannot do anything without audio say so, rather than
  // looking available and then throwing an error banner when pressed. Called on
  // every mic change and after each exercise rebuilds its pane.
  function syncMicControls() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-needs-mic]'), function (b) {
      b.disabled = !audio.running;
      b.title = audio.running ? '' : 'Start the microphone first';
    });
    var hint = document.getElementById('micHint');
    if (hint) hint.hidden = audio.running;
  }

  function showError(msg) {
    document.getElementById('errBox').innerHTML =
      '<div class="banner err">' + msg + '</div>';
  }
  function clearError() { document.getElementById('errBox').innerHTML = ''; }

  async function startMic() {
    clearError();
    try {
      // These three "helpful" features all corrupt acoustic measurement:
      // AGC rescales level, noise suppression eats the spectrum, echo
      // cancellation filters the signal.
      audio.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      showError('Could not open the microphone (' + e.name + '). Grant permission, or if you opened ' +
        'this as a file, run <code>python3 -m http.server</code> in this folder and use ' +
        '<code>http://localhost:8000/</code> instead.');
      return;
    }
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.ctx.state === 'suspended') await audio.ctx.resume();
    var src = audio.ctx.createMediaStreamSource(audio.stream);
    audio.analyser = audio.ctx.createAnalyser();
    audio.analyser.fftSize = 4096;
    src.connect(audio.analyser);
    audio.buf = new Float32Array(audio.analyser.fftSize);
    audio.running = true;
    setMicUI(true, Math.round(audio.ctx.sampleRate / 1000) + ' kHz, listening');
    requestAnimationFrame(loop);
  }

  function stopMic() {
    audio.running = false;
    if (audio.stream) audio.stream.getTracks().forEach(function (t) { t.stop(); });
    if (audio.ctx) audio.ctx.close();
    audio.ctx = audio.analyser = audio.stream = null;
    latest = null;
    resetSmoothers();
    // A take cannot continue without audio. Ending it here stops the exercise
    // sitting there labelled "recording" while nothing is being measured.
    if (current && current.abort) current.abort();
    setMicUI(false, 'microphone off');
  }

  function loop(ts) {
    if (!audio.running) return;
    audio.analyser.getFloatTimeDomainData(audio.buf);
    var a = DSP.analyze(audio.buf, audio.ctx.sampleRate);
    latest = a;

    if (a.voiced) {
      unvoicedRun = 0;
      smoothF0.push(a.f0);
      intonation.push(DSP.hzToSemitones(a.f0), ts);
      if (a.resonance != null) smoothRes.push(a.resonance);
      if (a.weightRaw != null) smoothWeight.push(a.weightRaw);
    } else {
      smoothF0.reset();
      if (++unvoicedRun >= SILENCE_FRAMES_TO_CLEAR) { smoothRes.reset(); smoothWeight.reset(); }
    }

    if (current && current.frame) current.frame(a, ts);
    requestAnimationFrame(loop);
  }

  // ==========================================================================
  // saved calibration
  // ==========================================================================

  var base = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(base)); } catch (e) {}
    renderBaseTable();
    renderExList();
  }

  // ==========================================================================
  // saved takes
  //
  // The scored numbers were computed and then thrown away, which meant the one
  // question practice actually asks — "is this moving?" — could not be
  // answered. Only the four medians and a timestamp are kept; no audio and no
  // per-frame data ever leaves the analysis loop.
  // ==========================================================================

  var history = loadHistory();
  function loadHistory() {
    try {
      var h = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(h) ? h : [];
    } catch (e) { return []; }
  }

  // `kind` is 'calibration' | 'passage' | 'free'. The first two are the same
  // text, so their resonance is comparable; free speech is a different text and
  // is excluded from the resonance chart on purpose.
  function recordTake(kind, m) {
    history.push({
      t: Date.now(),
      kind: kind,
      f0: m.f0 != null ? +m.f0.toFixed(1) : null,
      res: m.res != null ? +m.res.toFixed(2) : null,
      weight: m.weight != null ? +m.weight.toFixed(2) : null,
      sd: m.sd != null ? +m.sd.toFixed(2) : null
    });
    if (history.length > MAX_TAKES) history = history.slice(-MAX_TAKES);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    renderExList();
  }

  function clearHistory() {
    history = [];
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    renderExList();
  }

  // The pitch target, derived rather than assumed. It moves toward the
  // masculine range but is never allowed within FLOOR_MARGIN_ST of the lowest
  // pitch that was actually measured as comfortable.
  // One stage lower than where you speak now, heading toward the masculine
  // range, but never below a safe margin above your measured floor — and never
  // ABOVE where you already speak, which would be telling you to raise your
  // pitch. A narrow measured range legitimately means "no pitch work right
  // now", and the tool says so rather than inventing a target.
  function pitchTarget() {
    if (base.habitualF0 == null) return null;
    var stepDown = DSP.semitonesToHz(DSP.hzToSemitones(base.habitualF0) - 2);
    var wanted = Math.min(stepDown, MASC_F0_CEILING);
    var limited = false;

    if (base.safeFloor != null) {
      var safest = DSP.semitonesToHz(DSP.hzToSemitones(base.safeFloor) + FLOOR_MARGIN_ST);
      if (wanted < safest) { wanted = safest; limited = true; }
    }
    if (wanted >= base.habitualF0) {
      // No headroom at all between the floor and habitual speech.
      return { hz: base.habitualF0, limited: true, noHeadroom: true };
    }
    return { hz: wanted, limited: limited, noHeadroom: false };
  }

  function targetBand() {
    var t = pitchTarget();
    if (!t) return null;
    return { lo: t.hz * 0.94, hi: t.hz * 1.06, center: t.hz, limited: t.limited };
  }

  function renderBaseTable() {
    var rows = [];
    function row(label, value, note) {
      rows.push('<tr><td>' + label + '</td><td class="num">' + value +
        '</td></tr>' + (note ? '<tr><td colspan="2" style="color:var(--dim);font-size:12px;border:0;padding-top:0">' + note + '</td></tr>' : ''));
    }
    if (base.habitualF0 == null) {
      rows.push('<tr><td colspan="2" style="color:var(--dim)">Run <b>Calibrate</b> first — every target below is derived from your own voice.</td></tr>');
    } else {
      row('Habitual pitch', base.habitualF0.toFixed(0) + ' Hz');
      if (base.safeFloor != null) row('Comfortable floor', base.safeFloor.toFixed(0) + ' Hz');
      var t = pitchTarget();
      if (t) {
        row('Pitch target', t.hz.toFixed(0) + ' Hz',
          t.limited ? 'Held above your floor on purpose — pushing lower is where injuries come from.' : null);
      }
      if (base.resonance != null) {
        row('Resonance baseline', base.resonance.toFixed(1) + ' cm');
        row('Resonance goal', (base.resonance * RESONANCE_GOAL).toFixed(1) + ' cm');
      }
      if (base.intonationSd != null) row('Intonation', base.intonationSd.toFixed(1) + ' st');
    }
    document.querySelector('#baseTable tbody').innerHTML = rows.join('');
  }

  // ==========================================================================
  // shared UI pieces
  // ==========================================================================

  // `bar` adds a progress strip under the value. `markAt` (0-1) draws the
  // target notch on it.
  function meter(id, label, sub, bar) {
    return '<div class="meter idle" id="' + id + '"><div class="lab">' + label +
      '</div><div class="val" id="' + id + '-v">--</div><div class="sub" id="' + id + '-s">' +
      (sub || '') + '</div>' +
      (bar ? '<div class="bar"><i id="' + id + '-b"></i><u id="' + id + '-m" hidden></u></div>' : '') +
      '</div>';
  }
  function setMeter(id, value, sub, opts) {
    var el = document.getElementById(id);
    if (!el) return;
    document.getElementById(id + '-v').textContent = value;
    if (sub != null) document.getElementById(id + '-s').innerHTML = sub;
    if (opts && opts.hit != null) el.classList.toggle('hit', !!opts.hit);
    if (opts && opts.muted != null) el.classList.toggle('muted', !!opts.muted);
    el.classList.toggle('idle', value === '--' || value === '—');

    var bar = document.getElementById(id + '-b');
    if (bar && opts && opts.fill != null) {
      bar.style.width = Math.max(0, Math.min(1, opts.fill)) * 100 + '%';
    }
    var mark = document.getElementById(id + '-m');
    if (mark && opts && opts.markAt != null) {
      mark.hidden = false;
      mark.style.left = Math.max(0, Math.min(1, opts.markAt)) * 100 + '%';
    }
  }

  // Position of `hz` on the meter bar, on the same scale as the ribbon so the
  // bar and the trace agree.
  function pitchFill(hz) {
    if (!hz) return 0;
    var r = ribbonRange();
    return (Math.log2(hz) - Math.log2(r.lo)) / (Math.log2(r.hi) - Math.log2(r.lo));
  }

  // Scrolling pitch ribbon with the target band shaded.
  function Ribbon(canvas, opts) {
    this.c = canvas;
    this.g = canvas.getContext('2d');
    this.pts = [];
    this.opts = opts || {};
    var r = ribbonRange();
    this.loHz = r.lo; this.hiHz = r.hi;
  }

  // A fixed 60-320 Hz scale wastes most of the canvas: a voice working between
  // 130 and 160 Hz draws inside a tenth of the height, where the differences
  // that matter are invisible. Fit the scale to the range this speaker actually
  // uses, while always keeping the reference lines and the target in view.
  function ribbonRange() {
    var t = pitchTarget();
    // Everything that has to stay on screen: the floor, the target, the
    // reference lines, and where this speaker actually talks.
    var lo = Math.min(base.safeFloor != null ? base.safeFloor : 110,
                      t ? t.hz : MASC_F0_CEILING, MASC_F0_CEILING);
    var hi = Math.max(base.habitualF0 != null ? base.habitualF0 : 200, ANDROGYNOUS_HIGH);
    // Generous headroom below, since a glide can go under the measured floor.
    return { lo: Math.max(55, lo * 0.8), hi: Math.min(400, hi * 1.12) };
  }
  Ribbon.prototype.resize = function () {
    var r = this.c.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    this.c.width = Math.max(1, r.width * dpr);
    this.c.height = Math.max(1, r.height * dpr);
    this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = r.width; this.h = r.height;
  };
  Ribbon.prototype.y = function (hz) {
    var t = (Math.log2(hz) - Math.log2(this.loHz)) / (Math.log2(this.hiHz) - Math.log2(this.loHz));
    return this.h - t * this.h;
  };
  Ribbon.prototype.push = function (hz) {
    this.pts.push(hz || 0);
    var max = Math.floor(this.w / 2);
    while (this.pts.length > max) this.pts.shift();
  };
  Ribbon.prototype.draw = function (band) {
    var g = this.g;
    var rect = this.c.getBoundingClientRect();
    if (!this.w || Math.abs(rect.width - this.w) > 1) this.resize();
    g.clearRect(0, 0, this.w, this.h);
    g.fillStyle = '#0e1016';
    g.fillRect(0, 0, this.w, this.h);

    // reference lines at the boundaries listeners actually respond to
    var refs = [
      { hz: MASC_F0_CEILING, label: '130 Hz  reads male', col: 'rgba(90,211,154,.5)' },
      { hz: ANDROGYNOUS_LOW, label: '140', col: 'rgba(143,151,173,.25)' },
      { hz: ANDROGYNOUS_HIGH, label: '165  ambiguous zone', col: 'rgba(143,151,173,.25)' }
    ];
    refs.forEach(function (r) {
      var y = this.y(r.hz);
      g.strokeStyle = r.col; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, y); g.lineTo(this.w, y); g.stroke();
      g.fillStyle = 'rgba(143,151,173,.65)'; g.font = '11px system-ui';
      g.fillText(r.label, 6, y - 4);
    }, this);

    if (band) {
      var yTop = this.y(band.hi), yBot = this.y(band.lo);
      g.fillStyle = 'rgba(110,168,255,.13)';
      g.fillRect(0, yTop, this.w, yBot - yTop);
      g.strokeStyle = 'rgba(110,168,255,.5)';
      g.setLineDash([4, 4]);
      g.beginPath(); g.moveTo(0, this.y(band.center)); g.lineTo(this.w, this.y(band.center)); g.stroke();
      g.setLineDash([]);
      // Right-aligned: the reference labels are drawn on the left and the
      // target line often sits within a few pixels of one of them.
      g.fillStyle = 'rgba(184,211,255,.9)'; g.font = '11px system-ui';
      g.textAlign = 'right';
      g.fillText('target ' + band.center.toFixed(0) + ' Hz', this.w - 6, yTop - 5);
      g.textAlign = 'left';
    }

    // trace
    g.lineWidth = 2.2;
    g.strokeStyle = '#6ea8ff';
    var drawing = false;
    for (var i = 0; i < this.pts.length; i++) {
      var hz = this.pts[i];
      if (!hz) { if (drawing) { g.stroke(); drawing = false; } continue; }
      var x = i * 2, y = this.y(Math.min(this.hiHz, Math.max(this.loHz, hz)));
      if (band) g.strokeStyle = (hz >= band.lo && hz <= band.hi) ? '#5ad39a' : '#6ea8ff';
      if (!drawing) { g.beginPath(); g.moveTo(x, y); drawing = true; }
      else g.lineTo(x, y);
    }
    if (drawing) g.stroke();
  };

  // One sentence at a time, drawn whole.
  //
  // The scrolling ribbon is the wrong instrument for a contour: it reads two
  // pixels per frame, so a sentence arrives as a stream of disconnected
  // fragments that has already slid halfway off the canvas by the time you
  // could look at it, and its hertz scale flattens a three-semitone rise into a
  // few pixels. This draws one phrase across the full width, on a semitone
  // scale centred on that phrase's own average, and holds it on screen after
  // you stop speaking so there is something to actually look at.
  function Contour(canvas) {
    this.c = canvas;
    this.g = canvas.getContext('2d');
  }
  Contour.prototype.resize = Ribbon.prototype.resize;

  // Isolated frames where the pitch tracker slips an octave are what made the
  // trace look ragged; a median over a short window removes them without
  // rounding off a real contour, which lasts tenths of a second.
  //
  // The window is milliseconds and not a number of frames, for the same reason
  // the voiced-time minimums are: a 5-frame median is 40 ms on a 120 Hz screen
  // and 165 ms on a throttled one. At the wide end it erased the very dip
  // between syllables that the final-syllable search looks for, so the drill
  // read the whole end of the sentence as one syllable and called rises flat.
  function medianFilter(pts, pick, halfMs) {
    return pts.map(function (p, i) {
      var v = pick(p);
      if (v == null) return null;
      var w = [], j;
      for (j = i; j >= 0 && p.t - pts[j].t <= halfMs; j--) { if (pick(pts[j]) != null) w.push(pick(pts[j])); }
      for (j = i + 1; j < pts.length && pts[j].t - p.t <= halfMs; j++) { if (pick(pts[j]) != null) w.push(pick(pts[j])); }
      return w.length ? median(w) : v;
    });
  }
  var SMOOTH_HALF_MS = 25;   // ±25 ms: two frames either side at 60 Hz

  // `pts` are the frames of one phrase ({ t, st, rms }, st null when unvoiced);
  // `mark` is the scored final syllable, or null while the phrase is still
  // being spoken.
  Contour.prototype.draw = function (pts, mark, spanMs) {
    var g = this.g, i;
    var rect = this.c.getBoundingClientRect();
    if (!this.w || Math.abs(rect.width - this.w) > 1) this.resize();
    var w = this.w, h = this.h, PAD = 30;
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#0e1016';
    g.fillRect(0, 0, w, h);
    g.font = '11px system-ui';

    var voiced = pts ? pts.filter(function (p) { return p.st != null; }) : [];
    var SPAN = 6;  // semitones shown above and below the sentence's own average
    var mid = voiced.length ? median(voiced.map(function (p) { return p.st; })) : 0;
    var t0 = pts && pts.length ? pts[0].t : 0;
    var dur = Math.max(spanMs || 0, pts && pts.length ? pts[pts.length - 1].t - t0 : 0, 1200);
    function x(t) { return PAD + (t - t0) / dur * (w - PAD - 8); }
    function y(st) { return h / 2 - Math.max(-SPAN, Math.min(SPAN, st - mid)) / SPAN * (h / 2 - 14); }

    // Grid in semitones relative to this sentence, because the question is the
    // shape of the ending, not where the voice sits — pitch has its own drills.
    [4, 2, 0, -2, -4].forEach(function (st) {
      var yy = y(mid + st);
      g.strokeStyle = st === 0 ? 'rgba(143,151,173,.34)' : 'rgba(143,151,173,.13)';
      g.beginPath(); g.moveTo(PAD, yy); g.lineTo(w - 8, yy); g.stroke();
      g.fillStyle = 'rgba(143,151,173,.65)';
      g.textAlign = 'right';
      g.fillText(st === 0 ? 'avg' : (st > 0 ? '+' + st : st), PAD - 6, yy + 3.5);
    });
    g.textAlign = 'left';

    if (!voiced.length) {
      g.fillStyle = 'rgba(143,151,173,.6)';
      g.fillText(mark === false ? 'listening — read the sentence above, then pause'
                                : 'press Start take, then read the sentence above', PAD + 4, h / 2 - 10);
      return;
    }

    // The final syllable, shaded, so the verdict is visibly about one part of
    // the sentence rather than the whole thing.
    if (mark) {
      var x0 = x(mark.from), x1 = x(mark.to);
      g.fillStyle = mark.dir === 'rise' ? 'rgba(240,180,94,.13)' : 'rgba(90,211,154,.13)';
      g.fillRect(x0, 8, Math.max(2, x1 - x0), h - 16);
      g.fillStyle = mark.dir === 'rise' ? 'rgba(240,180,94,.85)' : 'rgba(90,211,154,.85)';
      g.textAlign = 'center';
      g.fillText('last syllable', (x0 + x1) / 2, h - 6);
      g.textAlign = 'left';
    }

    var st = medianFilter(pts, function (p) { return p.st; }, SMOOTH_HALF_MS);
    // Break the line only at a real pause. Every stop consonant devoices for a
    // few frames, and breaking there was most of what made this look choppy.
    var drawing = false, prevCol = null, prev = null;
    g.lineWidth = 2.4;
    g.lineJoin = 'round';
    for (i = 0; i < pts.length; i++) {
      if (st[i] == null) continue;
      var inMark = mark && pts[i].t >= mark.from && pts[i].t <= mark.to;
      var col = !mark ? '#6ea8ff'
        : inMark ? (mark.dir === 'rise' ? '#f0b45e' : '#5ad39a')
        : 'rgba(110,168,255,.45)';
      var here = { x: x(pts[i].t), y: y(st[i]) };
      var brk = prev == null || pts[i].t - prev.t > 120;
      if (drawing && (brk || col !== prevCol)) { g.stroke(); drawing = false; }
      if (!drawing) {
        g.strokeStyle = col;
        g.beginPath();
        // Rejoin from the previous point unless the gap was a real pause, so a
        // colour change part-way along does not leave a hole in the line.
        g.moveTo(brk ? here.x : prev.x, brk ? here.y : prev.y);
        drawing = true;
        prevCol = col;
      }
      g.lineTo(here.x, here.y);
      prev = { x: here.x, y: here.y, t: pts[i].t };
    }
    if (drawing) g.stroke();
  };

  // ==========================================================================
  // diagrams
  //
  // Every mechanism this tool asks you to feel — back-pressure, larynx height,
  // fold thickness — is spatial, and spatial things described only in prose
  // sound harder than they are. These are schematic on purpose: enough shape to
  // locate the sensation in your own throat, not enough to be an anatomy plate.
  // Each carries an aria-label saying the same thing in words, because the
  // diagram is an explanation and not decoration.
  // ==========================================================================

  // An SVG with width:100% will happily scale to a 1200px card and blow the
  // labels up to headline size, so each figure is capped at the width its
  // viewBox was drawn for — read off the viewBox rather than repeated by hand.
  function figure(svg, caption) {
    var vb = /viewBox="0 0 ([\d.]+)/.exec(svg);
    var cap = vb ? ' style="max-width:' + vb[1] + 'px"' : '';
    return '<figure class="diagram"><div class="dwrap"' + cap + '>' + svg + '</div>' +
      (caption ? '<figcaption><span>' + caption + '</span></figcaption>' : '') + '</figure>';
  }

  // Arrowhead markers are defined per-diagram with a unique id: only one
  // exercise is ever mounted at a time, but ids leaking between panes would
  // fail silently and look like a rendering bug.
  function arrowDef(id, color) {
    return '<defs><marker id="' + id + '" viewBox="0 0 8 8" refX="7" refY="4" ' +
      'markerWidth="5" markerHeight="5" orient="auto">' +
      '<path d="M0 0 L8 4 L0 8 Z" fill="' + color + '"/></marker></defs>';
  }

  var DIAGRAMS = {};

  DIAGRAMS.straw = function () {
    return figure(
      '<svg viewBox="0 0 520 148" role="img" aria-label="Cross-section of the vocal tract with a ' +
        'straw at the lips. Air backs up inside the tract and presses down on the vocal folds, so ' +
        'they meet more gently.">' +
      arrowDef('ar-straw', 'var(--good)') +
      '<rect x="72" y="34" width="286" height="72" fill="rgba(110,168,255,.10)"/>' +
      '<rect x="358" y="59" width="112" height="22" fill="rgba(110,168,255,.10)"/>' +
      '<path d="M72 34 H358 L358 59 H470" fill="none" stroke="var(--line)" stroke-width="2"/>' +
      '<path d="M72 106 H358 L358 81 H470" fill="none" stroke="var(--line)" stroke-width="2"/>' +
      // vocal folds, seen edge-on, with the glottal gap between them
      '<path d="M50 26 L78 62 L50 68 Z" fill="var(--accent)"/>' +
      '<path d="M50 114 L78 78 L50 72 Z" fill="var(--accent)"/>' +
      '<line x1="330" y1="70" x2="112" y2="70" stroke="var(--good)" stroke-width="2" ' +
        'marker-end="url(#ar-straw)"/>' +
      '<text x="222" y="60" fill="var(--good)" font-size="11.5" text-anchor="middle">back-pressure</text>' +
      '<text x="66" y="132" fill="var(--dim)" font-size="11.5" text-anchor="middle">vocal folds</text>' +
      '<text x="215" y="132" fill="var(--dim)" font-size="11.5" text-anchor="middle">vocal tract</text>' +
      '<text x="414" y="132" fill="var(--dim)" font-size="11.5" text-anchor="middle">straw</text>' +
      '</svg>',
      'The narrow opening traps air in the tract. That trapped air pushes back down on the folds, ' +
      'so they meet with less force for the same loudness — which is why this is the safe way to warm up.');
  };

  DIAGRAMS.larynx = function () {
    // Two throats side by side. The only difference is where the larynx sits;
    // the shaded column above it is the space that shapes the sound.
    function throat(x, laryY, label, sub, hi) {
      var col = hi ? 'var(--good)' : 'var(--dim)';
      return '<g transform="translate(' + x + ',0)">' +
        '<rect x="34" y="26" width="62" height="' + (laryY - 26) + '" ' +
          'fill="' + (hi ? 'rgba(90,211,154,.18)' : 'rgba(143,151,173,.22)') + '"/>' +
        '<path d="M34 26 V128 M96 26 V128" fill="none" stroke="var(--line)" stroke-width="2"/>' +
        '<line x1="34" y1="26" x2="96" y2="26" stroke="var(--line)" stroke-width="2"/>' +
        '<rect x="28" y="' + laryY + '" width="74" height="15" rx="4" fill="var(--panel-2)" ' +
          'stroke="' + col + '" stroke-width="1.5"/>' +
        '<line x1="118" y1="28" x2="118" y2="' + (laryY - 2) + '" stroke="' + col + '" ' +
          'stroke-width="1.5" marker-start="url(#ar-lx)" marker-end="url(#ar-lx)"/>' +
        '<text x="10" y="22" fill="var(--dim)" font-size="11">lips</text>' +
        '<text x="65" y="' + (laryY + 11) + '" fill="' + col + '" font-size="10.5" ' +
          'text-anchor="middle">larynx</text>' +
        '<text x="65" y="148" fill="' + col + '" font-size="12" font-weight="600" ' +
          'text-anchor="middle">' + label + '</text>' +

    }

      '<svg viewBox="0 0 400 176" role="img" aria-label="Two throats compared. With the larynx ' +
        'raised the space above it is short and the voice sounds smaller; with the larynx lowered ' +
        'that space is longer and the voice sounds larger.">' +
      arrowDef('ar-lx', 'var(--dim)') +
      throat(20, 62, 'raised', 'shorter space', false) +
      throat(220, 104, 'lowered', 'longer space', true) +
      '</svg>',
      'Nothing about the pitch has to change between these two. The shaded column is what the ' +
      'resonance number measures — a yawn lengthens it, and the sigh keeps it long while you make sound.');
  };

  DIAGRAMS.ng = function () {
    // The failure mode is invisible from inside your own head, so it gets equal
    // billing with the success case rather than a footnote.
    function panel(x, resPath, title, titleCol, sub) {
      return '<g transform="translate(' + x + ',0)">' +
        '<rect x="0" y="14" width="196" height="86" rx="8" fill="#0a0c12" stroke="var(--line)"/>' +
        '<path d="M18 30 C 70 42, 120 66, 178 84" fill="none" stroke="var(--accent)" stroke-width="2.4"/>' +
        '<path d="' + resPath + '" fill="none" stroke="var(--good)" stroke-width="2.4"/>' +
        '<text x="98" y="120" fill="' + titleCol + '" font-size="12.5" font-weight="600" ' +
          'text-anchor="middle">' + title + '</text>' +
        '<text x="98" y="136" fill="var(--dim)" font-size="11" text-anchor="middle">' + sub + '</text>' +
        '</g>';
    }
    return figure(
      '<svg viewBox="0 0 440 146" role="img" aria-label="Two traces. When the slide is done well ' +
        'the pitch line falls while the resonance line rises. When pitch is lowered with the folds ' +
        'alone, the pitch line falls but the resonance line stays flat.">' +
      panel(10, 'M18 84 C 70 76, 120 50, 178 32', 'moving together', 'var(--good)',
        'larynx rides down with the pitch') +
      panel(234, 'M18 58 L178 58', 'folds alone', 'var(--warn)',
        'pitch drops, space unchanged — tiring') +
      '<g transform="translate(10,0)">' +
        '<text x="0" y="9" fill="var(--accent)" font-size="11">— pitch</text>' +
        '<text x="58" y="9" fill="var(--good)" font-size="11">— resonance</text>' +
      '</g>' +
      '</svg>',
      'Both panels sound lower. Only the left one is something you can hold for a whole conversation.');
  };

  DIAGRAMS.weight = function () {
    // "Weight" is the least intuitive of the four measures, and the one most
    // easily faked by pressing — which is exactly what the diagram contrasts.
    function folds(x, depth, title, titleCol, sub) {
      var top = 62 - depth / 2;
      return '<g transform="translate(' + x + ',0)">' +
        '<rect x="20" y="16" width="58" height="92" rx="6" fill="var(--panel-2)" stroke="var(--line)"/>' +
        '<rect x="118" y="16" width="58" height="92" rx="6" fill="var(--panel-2)" stroke="var(--line)"/>' +
        '<rect x="78" y="' + top + '" width="40" height="' + depth + '" ' +
          'fill="' + (titleCol === 'var(--good)' ? 'rgba(90,211,154,.35)' : 'rgba(240,180,94,.35)') + '" ' +
          'stroke="' + titleCol + '" stroke-width="1.5"/>' +
        '<line x1="190" y1="' + top + '" x2="190" y2="' + (top + depth) + '" stroke="' + titleCol + '" ' +
          'stroke-width="1.5" marker-start="url(#ar-wt)" marker-end="url(#ar-wt)"/>' +
        '<text x="98" y="128" fill="' + titleCol + '" font-size="12.5" font-weight="600" ' +
          'text-anchor="middle">' + title + '</text>' +
        '<text x="98" y="144" fill="var(--dim)" font-size="11" text-anchor="middle">' + sub + '</text>' +
        '</g>';
    }
    return figure(
      '<svg viewBox="0 0 440 154" role="img" aria-label="The vocal folds seen from the front. Heavy ' +
        'folds touch over a deep area and give a full low note. Pressed folds touch over a shallow ' +

  // The one diagram carrying live numbers: where your own voice sits on the
  // scale the targets are drawn from.
  DIAGRAMS.pitchMap = function (opts) {
    opts = opts || {};
    // 190 Hz is the bottom of the cis-female average band (RESEARCH.md §2) and
    // is local to this drawing: nothing in the tool targets it, it is only the
    // point past which the "reads female" label is honest.
    var LO = 80, HI = 260, FEM_FLOOR = 190, W = 460, PAD = 14;
    function x(hz) { return PAD + (Math.min(HI, Math.max(LO, hz)) - LO) / (HI - LO) * (W - PAD * 2); }
    function zone(lo, hi, fill) {
      return '<rect x="' + x(lo).toFixed(1) + '" y="30" width="' + (x(hi) - x(lo)).toFixed(1) +
        '" height="30" fill="' + fill + '"/>';
    }
    function pin(hz, label, col, up) {
      if (hz == null) return '';
      var px = x(hz).toFixed(1);
      return '<g><line x1="' + px + '" y1="' + (up ? 22 : 30) + '" x2="' + px + '" y2="' +
        (up ? 60 : 70) + '" stroke="' + col + '" stroke-width="2"/>' +
        '<text x="' + px + '" y="' + (up ? 17 : 84) + '" fill="' + col + '" font-size="11.5" ' +
        'text-anchor="middle">' + label + '</text></g>';
    }
    var ticks = [100, 130, 165, 200, 240].map(function (t) {
      return '<text x="' + x(t).toFixed(1) + '" y="104" fill="var(--dim)" font-size="10.5" ' +
        'text-anchor="middle">' + t + '</text>';
    }).join('');
    return figure(
      '<svg viewBox="0 0 460 112" role="img" aria-label="A scale of speaking pitch in hertz. Below ' +
        '130 hertz listeners reliably hear a voice as male; between 140 and 165 hertz they stop ' +
        'agreeing; above roughly 190 hertz they reliably hear it as female.">' +
      zone(LO, MASC_F0_CEILING, 'rgba(90,211,154,.22)') +
      zone(MASC_F0_CEILING, ANDROGYNOUS_LOW, 'rgba(90,211,154,.10)') +
      zone(ANDROGYNOUS_LOW, ANDROGYNOUS_HIGH, 'rgba(240,180,94,.20)') +
      zone(ANDROGYNOUS_HIGH, FEM_FLOOR, 'rgba(110,168,255,.06)') +
      zone(FEM_FLOOR, HI, 'rgba(110,168,255,.16)') +
      '<rect x="' + PAD + '" y="30" width="' + (W - PAD * 2) + '" height="30" fill="none" ' +
        'stroke="var(--line)" rx="4"/>' +
      '<text x="' + x(105).toFixed(1) + '" y="49" fill="var(--good)" font-size="11" ' +
        'text-anchor="middle">reads male</text>' +
      '<text x="' + x(152).toFixed(1) + '" y="49" fill="var(--warn)" font-size="10.5" ' +
        'text-anchor="middle">ambiguous</text>' +
      '<text x="' + x(224).toFixed(1) + '" y="49" fill="var(--accent)" font-size="11" ' +
        'text-anchor="middle">reads female</text>' +
      ticks +
      pin(opts.now, 'you now', 'var(--text)', true) +
      pin(opts.target, 'target', 'var(--good)', false) +
      '</svg>',
      opts.caption || 'Hz. The ambiguous band is a real change in how listeners hear a voice, not a ' +
      'smooth gradient — which is why crossing it is worth more than the same drop anywhere else.');
  };

        // A count here would read as a step number beside the numbered drills.
